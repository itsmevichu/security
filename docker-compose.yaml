version: '3'
services:
  opensearch-node1:
    image: opensearchstaging/opensearch:3.8.0
    container_name: opensearch-node1
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=MyPassword@123
      - DISABLE_SECURITY_PLUGIN=false
      - DISABLE_INSTALL_DEMO_CONFIG=false
      - plugins.security.unsupported.restapi.allow_securityconfig_modification=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      # Recommended: store the superadmin secret in the OpenSearch keystore as
      # plugins.security.superadmin.secret_secure for production.
      # To support container-based deployments, a plain-text value may also be
      # supplied via env substitution to plugins.security.superadmin.secret,
      # but this is less secure than using the keystore.
      # - plugins.security.superadmin.secret=abcde
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data1:/usr/share/opensearch/data
      - opensearch-config:/usr/share/opensearch/config
      - ./build/distributions/opensearch-security-3.8.0.0-SNAPSHOT.jar:/usr/share/opensearch/plugins/opensearch-security/opensearch-security-3.8.0.0.jar
    ports:
      - 9200:9200
      - 9600:9600
      - 5005:5005
    networks:
      - opensearch-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.5.0
    container_name: opensearch-dashboards
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch-node1:9200"]'
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: MyPassword@123
      OPENSEARCH_SSL_VERIFICATIONMODE: none
      # OPENSEARCH_SECURITY_MULTITENANCY_ENABLED: "false"
      # OPENSEARCH_SECURITY_MULTITENANCY_TENANTS_PREFERRED: '["Private", "Global", "abc"]'
    volumes:
      - ./opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro

    ports:
      - 5601:5601
    networks:
      - opensearch-net
    depends_on:
      - opensearch-node1

volumes:
  opensearch-data1:
  opensearch-config:

networks:
  opensearch-net:
